<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verbali di cantiere</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone/icona-180.png">
<link rel="icon" type="image/png" href="icone/icona-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Verbali">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: app da telefono a una colonna. Testata fissa (indietro, titolo, stato del salvataggio, schede dei cinque passi), contenuto del passo, foglio di firma e libreria a tutto schermo. Colori dei cartelli di sicurezza: blu obbligo, giallo avvertimento, rosso divieto, verde condizione sicura. */
:root {
  --bg: #EEF0EE; --surface: #FFFFFF; --sunk: #F6F7F6; --fg: #1C2124; --muted: #5A6266; --line: #D3D7D5;
  --obbligo: #1D5BA8; --obbligo-fg: #FFFFFF; --avviso: #F2B300; --avviso-ink: #1C2124; --avviso-bg: #FFF6D6;
  --divieto: #C8261E; --divieto-bg: #FCE9E7; --sicuro: #1E7A44; --sicuro-bg: #E5F3EA;
  --paper: #FFFFFF; --ink: #10151A; --guide: #9AA3A8;
  --font-display: "Archivo", "Arial Narrow", Arial, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131719; --surface: #1C2124; --sunk: #171B1D; --fg: #E6E9E7; --muted: #A2AAAD; --line: #343B3F;
    --obbligo: #4F86D6; --obbligo-fg: #0B1220; --avviso: #F2C14E; --avviso-ink: #131719; --avviso-bg: #2E2715;
    --divieto: #E5574F; --divieto-bg: #35191A; --sicuro: #4DB57A; --sicuro-bg: #16291E;
    --paper: #F3F4F2; --ink: #10151A; --guide: #8B959A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131719; --surface: #1C2124; --sunk: #171B1D; --fg: #E6E9E7; --muted: #A2AAAD; --line: #343B3F;
  --obbligo: #4F86D6; --obbligo-fg: #0B1220; --avviso: #F2C14E; --avviso-ink: #131719; --avviso-bg: #2E2715;
  --divieto: #E5574F; --divieto-bg: #35191A; --sicuro: #4DB57A; --sicuro-bg: #16291E;
  --paper: #F3F4F2; --ink: #10151A; --guide: #8B959A; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 17px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 680px; margin: 14px auto 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 680px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding-bottom: 8px; }
.bar-title { display: grid; gap: 1px; min-width: 0; flex: 1; }
.eyebrow { font-family: var(--font-display); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1.15; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: .05em; text-transform: uppercase; margin: 0 0 10px; color: var(--muted); }
h3 { font-family: var(--font-display); font-weight: 600; font-size: 16px; margin: 0; }
.back { min-height: 40px; padding: 8px 12px; font-size: 15px; }
.salva { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tline { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex-wrap: wrap; }
/* anteprima: il foglio del verbale, sempre bianco come la carta */
#prevBody { overflow-y: auto; min-height: 0; background: var(--sunk); border-radius: 6px; padding: 8px; }
.carta { --c-bg: #FFFFFF; --c-ink: #111111; --c-grigio: #E7E6E6; --c-line: #000000; --c-muted: #595959; --c-dc: #FFF0A8;
  background: var(--c-bg); color: var(--c-ink); font: 12.5px/1.35 Arial, Helvetica, sans-serif; padding: 18px 16px 24px; border-radius: 2px;
  box-shadow: 0 1px 4px rgba(0, 0, 0, .25); max-width: 760px; margin: 0 auto; display: grid; gap: 6px; }
.carta .intest { color: var(--c-muted); font-size: 11px; line-height: 1.25; margin-bottom: 6px; }
.carta .mod { color: var(--c-muted); font-size: 10px; }
.carta .tit { text-align: center; font-weight: 700; font-size: 15px; margin: 2px 0 0; }
.carta .sub { text-align: center; font-size: 11px; margin: 0 0 6px; }
.carta table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.carta th, .carta td { border: 1px solid var(--c-line); padding: 3px 5px; vertical-align: middle; text-align: left; overflow-wrap: anywhere; font-size: 11.5px; }
.carta th { background: var(--c-grigio); text-align: center; font-weight: 700; }
.carta td.k { background: var(--c-grigio); font-weight: 700; width: 32%; }
.carta .riq { border: 1px solid var(--c-line); padding: 3px 6px; display: grid; gap: 2px; }
.carta .riq p, .carta p { margin: 0; }
.carta .sez { font-weight: 700; margin-top: 8px; }
.carta .gius { text-align: justify; }
.carta .cb { padding-left: 20px; text-indent: -20px; }
.carta .dc { background: var(--c-dc); }
.carta .auto { color: var(--c-muted); font-style: italic; }
.carta .small { font-size: 10.5px; }
.carta .fotogr { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.carta .fotogr figure { margin: 0; display: grid; gap: 3px; text-align: center; font-size: 10.5px; }
.carta .fotogr img { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: var(--c-grigio); }
.carta td.firma-cella { height: 74px; text-align: center; }
.carta td.firma-cella img { max-height: 54px; max-width: 100%; display: block; margin: 0 auto; }
.carta td.firma-cella span { display: block; color: var(--c-muted); font-size: 9.5px; }
.salva.err { color: var(--divieto); font-weight: 600; }
.tabs { max-width: 680px; margin: 0 auto; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; min-height: 38px; padding: 7px 12px; border-radius: 999px; font-size: 15px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.tab .n { font-family: var(--font-display); font-size: 12px; width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--sunk); color: var(--muted); }
.tab[aria-current="step"] { border-color: var(--obbligo); background: var(--obbligo); color: var(--obbligo-fg); }
.tab[aria-current="step"] .n { background: var(--obbligo-fg); color: var(--obbligo); }
.tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--avviso); }
section.block { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; min-width: 0; display: grid; gap: 10px; }
section.block.fondo { margin-top: 28px; background: transparent; border-style: dashed; }
section.block > h2 { margin: 0; }
.muted { color: var(--muted); font-size: 15px; }
.small { font-size: 14px; }
label.lab { font-weight: 600; font-size: 15px; display: block; margin-bottom: 4px; }
input[type=text], input[type=date], input[type=time], textarea, select { width: 100%; min-width: 0; max-width: 100%; font: 17px/1.4 var(--font-body); color: var(--fg); background: var(--sunk); border: 1.5px solid var(--line); border-radius: 6px; padding: 10px 12px; }
textarea { min-height: 84px; resize: vertical; }
textarea.big { min-height: 150px; }
input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--obbligo); outline-offset: 1px; }
input:disabled, textarea:disabled, select:disabled { opacity: .75; }
.duo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
button { font: 600 16px/1.1 var(--font-body); border-radius: 6px; padding: 12px 16px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; min-height: 46px; }
button.primary { background: var(--obbligo); border-color: var(--obbligo); color: var(--obbligo-fg); }
button.ok { background: var(--sicuro); border-color: var(--sicuro); color: var(--obbligo-fg); }
button.warn { border-color: var(--divieto); color: var(--divieto); }
button.link { border: 0; background: none; color: var(--obbligo); padding: 6px 0; min-height: 0; text-align: left; }
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, .tab:focus-visible { outline: 3px solid var(--obbligo); outline-offset: 2px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > .grow { flex: 1; }
.full { width: 100%; }
.check { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line); cursor: pointer; }
.check:first-of-type { border-top: 0; }
.check input { width: 24px; height: 24px; margin: 2px 0 0; accent-color: var(--obbligo); }
.check .t { min-width: 0; display: grid; gap: 2px; }
.check .t b { font-weight: 600; overflow-wrap: anywhere; }
.check .t span { color: var(--muted); font-size: 15px; }
.chip { display: inline-block; font-size: 13px; line-height: 1.3; padding: 2px 8px; border-radius: 4px; background: var(--avviso-bg); color: var(--fg); border-left: 4px solid var(--avviso); justify-self: start; }
.chip.red { background: var(--divieto-bg); border-left-color: var(--divieto); }
.chip.green { background: var(--sicuro-bg); border-left-color: var(--sicuro); }
details.grp { border-top: 1px solid var(--line); padding-top: 8px; }
details.grp:first-of-type { border-top: 0; padding-top: 0; }
details.grp summary { cursor: pointer; font-weight: 600; padding: 6px 0; list-style-position: outside; }
.items { display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.item textarea { min-height: 64px; }
.extra { border-top: 1px solid var(--line); padding-top: 8px; }
.item button { min-height: 40px; padding: 8px 10px; font-size: 14px; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; min-height: 40px; padding: 8px 12px; font-size: 15px; }
.seg button + button { border-left: 1.5px solid var(--line); }
.seg button[aria-pressed="true"].si { background: var(--sicuro); color: var(--obbligo-fg); }
.seg button[aria-pressed="true"].no { background: var(--avviso); color: var(--avviso-ink); }
.prec { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
.prec:first-of-type { border-top: 0; padding-top: 0; }
.alert { border-radius: 6px; padding: 10px 12px; font-size: 15px; background: var(--avviso-bg); border-left: 5px solid var(--avviso); }
.alert.red { background: var(--divieto-bg); border-left-color: var(--divieto); }
.alert.green { background: var(--sicuro-bg); border-left-color: var(--sicuro); }
.alert ul { margin: 4px 0 0; padding-left: 18px; }
.proposta { border: 2px dashed var(--obbligo); border-radius: 6px; padding: 12px; display: grid; gap: 8px; background: var(--sunk); }
.proposta ol, .proposta ul { margin: 0; padding-left: 20px; }
.card { display: grid; gap: 4px; text-align: left; width: 100%; background: var(--surface); }
.card .meta { color: var(--muted); font-size: 14px; font-weight: 400; }
/* cartelle dei cantieri (home) e i due tasti dentro la cartella */
.ico { display: inline-grid; place-items: center; }
.ico svg { width: 100%; height: 100%; display: block; }
.cartella { grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 14px 14px; }
.cartella .ico { width: 40px; height: 40px; color: var(--avviso); }
.cartella .testo { display: grid; gap: 4px; min-width: 0; }
.cartella .freccia { font: 600 26px/1 var(--font-display); color: var(--muted); }
.tiles { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.tile { display: grid; justify-items: start; align-content: start; gap: 6px; text-align: left; padding: 16px 14px; min-height: 132px; }
.tile .ico { width: 34px; height: 34px; }
.tile .tt { font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1.15; }
.tile .ts { font-weight: 400; font-size: 14px; line-height: 1.35; color: var(--muted); }
.tile.primary .ts { color: var(--obbligo-fg); opacity: .9; }
@media (max-width: 340px) { .tiles { grid-template-columns: minmax(0, 1fr); } .tile { min-height: 0; } }
.stato { font-family: var(--font-display); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 3px; justify-self: start; }
.stato.bozza { background: var(--sunk); color: var(--muted); border: 1px solid var(--line); }
.stato.firma { background: var(--avviso); color: var(--avviso-ink); }
.stato.firmato { background: var(--sicuro); color: var(--obbligo-fg); }
.stato.archiviato { background: var(--sunk); color: var(--sicuro); border: 1px solid var(--sicuro); }
.foto { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.foto figure { margin: 0; display: grid; gap: 6px; min-width: 0; }
.foto img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 4px; background: var(--sunk); }
.foto textarea { min-height: 56px; font-size: 15px; }
.foto button { min-height: 36px; padding: 6px 10px; font-size: 14px; }
/* mezzi fotografati (richiesta del CSE il 17/11/2026: la foto al posto di marca, modello e targa scritti a mano) */
.mezzo { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 10px; align-items: start; padding-top: 10px; border-top: 1px solid var(--line); }
.mezzo img, .mz-foto img { width: 116px; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 4px; background: var(--sunk); display: block; }
.mezzo .campi { display: grid; gap: 6px; min-width: 0; }
.mezzo select, .mezzo input[type=text] { padding: 7px 10px; }
.mezzo button, .mz-foto button { min-height: 38px; padding: 6px 10px; font-size: 14px; }
.mz-foto { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 0 0 8px 36px; }
.mz-foto:empty { display: none; }
.lettura { display: grid; gap: 12px; }
.lettura dl { display: grid; grid-template-columns: minmax(96px, 32%) minmax(0, 1fr); gap: 4px 12px; margin: 0; }
.lettura dt { color: var(--muted); font-size: 14px; }
.lettura dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.lettura ul, .lettura ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.lettura h3 { font-size: 14px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.firma { border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: grid; gap: 10px; }
.firma.ok { border-color: var(--sicuro); }
.firma img { background: var(--paper); border-radius: 4px; padding: 6px; max-height: 120px; width: auto; justify-self: start; }
.stamp { font-size: 14px; color: var(--sicuro); font-variant-numeric: tabular-nums; }
.chi { display: grid; gap: 1px; }
.chi .ruolo { font-size: 14px; color: var(--muted); }
.chi .nome { font-weight: 600; }
/* fogli a tutto schermo */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: grid; grid-template-rows: auto 1fr auto; gap: 10px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.sheet .testa { display: flex; justify-content: space-between; align-items: end; gap: 10px; flex-wrap: wrap; }
#paper { position: relative; background: var(--paper); border-radius: 6px; border: 1px solid var(--line); min-height: 0; overflow: hidden; }
#paper canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
#paper .linea { position: absolute; left: 6%; right: 6%; bottom: 26%; border-bottom: 1.5px solid var(--guide); pointer-events: none; }
#paper .x { position: absolute; left: 6%; bottom: calc(26% + 6px); font: 600 22px/1 var(--font-display); color: var(--guide); pointer-events: none; }
#paper .hint { position: absolute; left: 0; right: 0; bottom: 10%; text-align: center; font-size: 14px; color: var(--guide); pointer-events: none; }
.sheet .piede { display: grid; gap: 8px; }
.sheet .piede .row button { flex: 1; }
#padErr { color: var(--divieto); font-size: 15px; min-height: 1.2em; }
#libBody { overflow-y: auto; min-height: 0; display: grid; gap: 14px; align-content: start; }
#libBody .voce { text-align: left; font-weight: 400; font-size: 15px; line-height: 1.4; width: 100%; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 6px; font-size: 15px; max-width: min(92vw, 520px); }
@media (prefers-reduced-motion: no-preference) { button, .tab { transition: background-color .15s, border-color .15s; } }
/* versione autonoma: impostazioni, scheda del cantiere, stato della copia nel Drive */
[hidden] { display: none !important; }   /* i fogli a tutto schermo (firma, prescrizioni tipo, anteprima) restano chiusi finché non si aprono */
html, body { margin: 0; }
.drive { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 15px; color: var(--muted); }
.drive .pallino { width: 10px; height: 10px; border-radius: 50%; background: var(--guide); flex: none; }
.drive.ok .pallino { background: var(--sicuro); } .drive.attesa .pallino { background: var(--avviso); } .drive.errore .pallino { background: var(--divieto); }
.drive .grow { flex: 1; min-width: 12em; }
.campo { display: grid; gap: 4px; margin-top: 10px; }
.campo > span { font-size: 15px; color: var(--muted); }
.campo input[type=text], .campo input[type=email], .campo input[type=password], .campo textarea, .campo select { width: 100%; }
.voce-ed { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-top: 10px; background: var(--sunk); display: grid; gap: 6px; }
.voce-ed .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.voce-ed .row > input[type=text] { flex: 1; min-width: 9em; }
.intest-img { max-width: 100%; display: block; }
input[type=email], input[type=password] { width: 100%; min-width: 0; max-width: 100%; font: 17px/1.4 var(--font-body); color: var(--fg); background: var(--sunk); border: 1.5px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.anteprima-img { max-width: 100%; max-height: 90px; display: block; margin-top: 6px; border: 1px solid var(--line); background: #fff; }
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <button type="button" class="back" id="btnBack" hidden>‹ Indietro</button>
    <div class="bar-title">
      <span class="eyebrow" id="barEyebrow">CSE · art. 92 D.Lgs. 81/2008</span>
      <div class="tline"><h1 id="barTitle">Verbali di cantiere</h1><span class="salva" id="salva" aria-live="polite"></span></div>
    </div>
    <button type="button" class="back" id="btnPrev" hidden>Anteprima</button>
    <button type="button" class="back" id="btnImp" hidden>Impostazioni</button>
  </div>
  <nav class="tabs" id="tabs" hidden aria-label="Passi del verbale"></nav>
</header>

<main class="wrap" id="main">
  <section class="block"><h2>Apertura</h2><div class="muted">Caricamento dei cantieri…</div></section>
</main>

<div id="pad" class="sheet" hidden>
  <div class="testa">
    <div class="chi"><span class="ruolo" id="padRuolo"></span><span class="nome" id="padNome"></span></div>
    <span class="eyebrow">Firma col dito</span>
  </div>
  <div id="paper">
    <span class="x">×</span><span class="linea"></span><span class="hint" id="padHint">Firma sopra la linea</span>
    <canvas id="canvas" aria-label="Spazio per la firma"></canvas>
  </div>

      scriviBusy("Preparo il PDF: impaginazione…");
      var info = { pagine: 0 }, dd = docVerbale(r.img, r.foto, info);
      return new Promise(function (ok, ko) { try { window.pdfMake.createPdf(dd).getBlob(function (b) { ok({ blob: b, info: info }); }); } catch (e) { ko(e); } });
    }).then(function (r) {
      var nome = nomePdf(), avvisi = [];
      if (r.info.fotoMancanti) avvisi.push(r.info.fotoMancanti === 1 ? "1 foto non è entrata" : r.info.fotoMancanti + " foto non sono entrate");
      if (r.info.mancano.length) avvisi.push("mancano le firme di " + r.info.mancano.join(", "));
      var avviso = avvisi.length ? "Attenzione: " + avvisi.join("; ") + ". Rifai il PDF con la rete buona." : "";
      S.pdf = { vid: vid, blob: r.blob, nome: nome, pagine: r.info.pagine, avviso: avviso };
      var msg = avviso ? "PDF pronto, ma " + avvisi.join("; ") + "." : "PDF pronto.";
      if (!S.assets) return msg;
      return S.assets.upload(new File([r.blob], nome, { type: "application/pdf" })).then(function (a) {
        var vecchio = S.v && S.vid === vid && S.v.pdf ? S.v.pdf.id : null;
        if (S.vid === vid && S.v) { S.v.pdf = { id: a.id, nome: nome, pagine: r.info.pagine, creato: new Date().toISOString(), avviso: avviso }; touch(); flush(); }
        if (vecchio && vecchio !== a.id) S.assets.delete(vecchio).then(function () {}, function () {});
        return msg;
      }, function () { return msg + " Non è stato salvato online: mandalo per mail adesso."; });
    }).then(function (msg) { fine(msg); return S.pdf; }, function (e) {
      fine("Il PDF non si è potuto preparare: " + ((e && e.message) || "errore") + ".");
      var err = new Error((e && e.message) || "errore"); err.giaDetto = true; throw err;
    });
    return S.pdfPromise;
  }
  function pdfDaArchivio() {
    if (S.pdf && S.pdf.vid === S.vid) return Promise.resolve(S.pdf);
    var p = S.v && S.v.pdf, vid = S.vid;
    if (!p) return Promise.reject(new Error("Prepara prima il PDF."));
    return fetch("_blob/" + p.id).then(function (r) { if (!r.ok) throw new Error("Il PDF salvato non si trova più: rifallo."); return r.blob(); })
      .then(function (b) { S.pdf = { vid: vid, blob: b, nome: p.nome, pagine: p.pagine }; return S.pdf; });
  }
  function salvaPdf(p) {
    if (!S.downloads) { toast("Da qui il file non si può passare al telefono."); return; }
    S.downloads.save({ filename: p.nome, data: p.blob }).then(function () { toast("Scegli Mail e mandalo al tuo indirizzo."); }, function (e) {
      var c = e && e.code;
      if (c === "declined") return;
      toast(c === "rate_limited" ? "C'è già una richiesta aperta: riprova tra poco." : "Il PDF non si è potuto passare al telefono (" + (c || "errore") + ").");
    });
  }
  function inviaPdf() {
    var c = cantiere(), v = S.v, pronto = S.pdf && S.pdf.vid === S.vid ? S.pdf : null;
    var oggetto = (c.nome || v.cantiere) + " - verbale di visita in cantiere n. " + p2(v.numero) + " del " + (v.data || "");
    var tocco = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    if (pronto && tocco && navigator.canShare) {
      var file = new File([pronto.blob], pronto.nome, { type: "application/pdf" }), puo = false;
      try { puo = navigator.canShare({ files: [file] }); } catch (e) { puo = false; }
      if (puo) {
        navigator.share({ files: [file], title: oggetto, text: oggetto }).then(function () {}, function (e) { if (e && e.name === "AbortError") return; salvaPdf(pronto); });
        return;
      }
    }
    // PDF non ancora in mano: si aspetta quello in preparazione, oppure si scarica quello salvato, oppure si fa adesso
    var p = pronto ? Promise.resolve(pronto) : S.pdfPromise ? S.pdfPromise : v.pdf ? pdfDaArchivio() : preparaPdf();
    if (!pronto) toast("Preparo il PDF, poi si apre l'invio…");
    p.then(salvaPdf, function (e) { if (e && e.message && !e.giaDetto) toast(e.message); });
  }

  // ------------------------------------------------------------------ foglio di firma
  var pad = document.getElementById("pad"), paper = document.getElementById("paper"), cv = document.getElementById("canvas");
  var ctx = cv.getContext("2d"), strokes = [], cur = null, dpr = 1, LW = 2.8, padFirmatario = null;
  var btnOk = document.getElementById("btnConferma"), padErr = document.getElementById("padErr"), hint = document.getElementById("padHint");
  function dimensiona() { var r = paper.getBoundingClientRect(); dpr = window.devicePixelRatio || 1; cv.width = Math.max(1, Math.round(r.width * dpr)); cv.height = Math.max(1, Math.round(r.height * dpr)); ridisegna(); }
  function tratto(c, pts, sc, ox, oy) {
    if (!pts.length) return;
    c.beginPath(); c.moveTo((pts[0][0] - ox) * sc, (pts[0][1] - oy) * sc);
    if (pts.length === 1) c.lineTo((pts[0][0] - ox) * sc + 0.1, (pts[0][1] - oy) * sc);
    for (var i = 1; i < pts.length - 1; i++) { var mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
      c.quadraticCurveTo((pts[i][0] - ox) * sc, (pts[i][1] - oy) * sc, (mx - ox) * sc, (my - oy) * sc); }
    if (pts.length > 1) { var l = pts[pts.length - 1]; c.lineTo((l[0] - ox) * sc, (l[1] - oy) * sc); }
    c.stroke();
  }
  function stile(c, w) { c.lineCap = "round"; c.lineJoin = "round"; c.lineWidth = w; c.strokeStyle = "#10151A"; }
  function lunghezza() { var t = 0; strokes.forEach(function (s) { for (var i = 1; i < s.length; i++) t += Math.hypot(s[i][0] - s[i - 1][0], s[i][1] - s[i - 1][1]); }); return t; }
  function ridisegna() {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); stile(ctx, LW * dpr);
    strokes.forEach(function (s) { tratto(ctx, s, dpr, 0, 0); }); if (cur) tratto(ctx, cur, dpr, 0, 0);
    btnOk.disabled = lunghezza() < 40; hint.hidden = strokes.length > 0 || !!cur;
  }
  function punto(e) { var r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  cv.addEventListener("pointerdown", function (e) { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (x) {} cur = [punto(e)]; padErr.textContent = ""; ridisegna(); });
  cv.addEventListener("pointermove", function (e) { if (!cur) return; e.preventDefault(); var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : []; (evs.length ? evs : [e]).forEach(function (ev) { cur.push(punto(ev)); }); ridisegna(); });
  function fine() { if (cur) { strokes.push(cur); cur = null; ridisegna(); } }
  cv.addEventListener("pointerup", fine); cv.addEventListener("pointercancel", fine);
  if (window.ResizeObserver) new ResizeObserver(function () { if (!pad.hidden) dimensiona(); }).observe(paper);
  function esporta() {
    var minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
    strokes.forEach(function (s) { s.forEach(function (p) { minx = Math.min(minx, p[0]); miny = Math.min(miny, p[1]); maxx = Math.max(maxx, p[0]); maxy = Math.max(maxy, p[1]); }); });
    minx -= 8; miny -= 8; maxx += 8; maxy += 8;
    var w = maxx - minx, hh = maxy - miny, sc = Math.min(2, 900 / Math.max(w, 1));
    var o = document.createElement("canvas"); o.width = Math.ceil(w * sc); o.height = Math.ceil(hh * sc);
    var c = o.getContext("2d"); stile(c, LW * sc); strokes.forEach(function (s) { tratto(c, s, sc, minx, miny); });
    return { png: o.toDataURL("image/png"), larghezza: o.width, altezza: o.height };
  }
  function apriPad(f) {
    padFirmatario = f; strokes = []; cur = null; padErr.textContent = "";
    document.getElementById("padRuolo").textContent = f.ruolo; document.getElementById("padNome").textContent = f.nome;
    pad.hidden = false; document.documentElement.style.overflow = "hidden"; requestAnimationFrame(dimensiona);
  }
  function chiudiPad() { pad.hidden = true; padFirmatario = null; document.documentElement.style.overflow = ""; }
  document.getElementById("btnAnnulla").addEventListener("click", chiudiPad);
  document.getElementById("btnCancella").addEventListener("click", function () { strokes = []; cur = null; padErr.textContent = ""; ridisegna(); });
  btnOk.addEventListener("click", function () {
    var f = padFirmatario; if (!f || !S.db || !S.vid) return;
    var img = esporta(); btnOk.disabled = true; btnOk.textContent = "Salvataggio…";
    S.db.doc("firme/" + S.vid + "__" + f.chiave).set({ verbale: S.vid, chiave: f.chiave, nome: f.nome, ruolo: f.ruolo,
      png: img.png, larghezza: img.larghezza, altezza: img.altezza, firmatoIl: new Date().toISOString() }).then(function () {
      btnOk.textContent = "Conferma firma"; chiudiPad();
    }, function (e) {
      btnOk.textContent = "Conferma firma"; btnOk.disabled = false;
      padErr.textContent = e && e.code === "quota_exceeded" ? "Spazio delle firme esaurito: avvisa Claude." : e && e.code === "invalid_argument" ? "La firma non si è potuta salvare: cancella e firma di nuovo." : "Firma non salvata: controlla la connessione e riprova.";
    });
  });

  avvia();
})();
